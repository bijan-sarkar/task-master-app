name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r task-manager-app/backend/requirements.txt
          pip install pytest flake8 httpx

      - name: Lint with Flake8
        run: |
          flake8 task-manager-app/backend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 task-manager-app/backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Test Suite
        run: |
          pytest task-manager-app/backend/tests

  validate-docker:
    name: Validate Docker Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build task-manager-app/backend --file task-manager-app/backend/Dockerfile
